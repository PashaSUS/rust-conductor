{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rust-conductor.fullname" . }}-migrate
  labels:
    {{- include "rust-conductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "rust-conductor.backend.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: MIGRATE_ONLY
              value: "true"
            - name: NUM_SHARDS
              value: {{ .Values.backend.env.NUM_SHARDS | default "1" | quote }}
            - name: SHARD_DATABASE_URLS
              value: {{ include "rust-conductor.postgresUrl" . | quote }}
            - name: REDIS_URLS
              value: {{ include "rust-conductor.redisUrl" . | quote }}
            - name: KAFKA_BROKERS
              value: {{ include "rust-conductor.kafkaBrokers" . | quote }}
            - name: RUST_LOG
              value: "info"
{{- end }}
