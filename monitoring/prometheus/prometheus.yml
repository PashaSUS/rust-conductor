global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Rust Conductor backend metrics
  - job_name: "rust-conductor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8090"]
        labels:
          service: "rust-conductor-backend"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
