# Standalone docker-compose for Rust Conductor — no repo clone needed.
#
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/PashaSUS/rust-conductor/main/docker-compose.ghcr.yml -o docker-compose.yml
#   docker compose up -d
#
# UI:        http://localhost:3170
# REST API:  http://localhost:8090
# Swagger:   http://localhost:8090/swagger-ui/
# gRPC:      localhost:50055
# Seq Logs:  http://localhost:9321
# Prometheus: http://localhost:9090
# Grafana:   http://localhost:3000  (admin/admin)

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres-shard-0:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shard0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer ────────────────────────────────────────────────────────
  pgbouncer-shard-0:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres-shard-0
      DB_PORT: "5432"
      DB_USER: conductor
      DB_PASSWORD: conductor
      DB_NAME: conductor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────
  redis-0:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-0:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Seq (structured logs) ────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "9321:80"
    volumes:
      - seqdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft) ───────────────────────────────────────────────────
  kafka-0:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      CLUSTER_ID: "conductor-kafka-cluster-001"
    volumes:
      - kafkadata-0:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── RustFS (S3-compatible storage) ──────────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: "/logs"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data
      - rustfslogs:/logs

  # ── Backend (migrations) ────────────────────────────────────────────
  backend-migrate:
    image: ghcr.io/pashasus/rust-conductor/backend:latest
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      NUM_SHARDS: "1"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@postgres-shard-{i}:5432/conductor"
      REDIS_URLS: "redis://redis-0:6379"
      KAFKA_BROKERS: "kafka-0:9092"
      RUST_LOG: "info"
      MIGRATE_ONLY: "true"
      SEQ_URL: "http://seq:80"
      S3_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: "conductor-payloads"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: "rustfsadmin"
      S3_SECRET_KEY: "rustfsadmin"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      seq:
        condition: service_healthy
      rustfs:
        condition: service_started

  # ── Backend ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/pashasus/rust-conductor/backend:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "50055:50055"
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      GRPC_PORT: "50055"
      NUM_SHARDS: "1"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@pgbouncer-shard-{i}:6432/conductor"
      REDIS_URLS: "redis://redis-0:6379"
      KAFKA_BROKERS: "kafka-0:9092"
      CORS_ORIGIN: "http://localhost:3170"
      RUST_LOG: "warn"
      SKIP_MIGRATIONS: "true"
      SEQ_URL: "http://seq:80"
      S3_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: "conductor-payloads"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: "rustfsadmin"
      S3_SECRET_KEY: "rustfsadmin"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      pgbouncer-shard-0:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      seq:
        condition: service_healthy
      rustfs:
        condition: service_started

  # ── Frontend ────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/pashasus/rust-conductor/frontend:latest
    restart: unless-stopped
    ports:
      - "3170:3170"
    depends_on:
      - backend

  # ── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  pgdata_shard0:
  redisdata-0:
  kafkadata-0:
  seqdata:
  rustfsdata:
  rustfslogs:
  prometheusdata:
  grafanadata:
