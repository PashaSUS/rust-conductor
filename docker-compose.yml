  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NUM_SHARDS: "8"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@postgres-shard-{i}:5432/conductor"
      REDIS_URLS: "redis://redis-0:6379/0,redis://redis-1:6379/0,redis://redis-2:6379/0,redis://redis-3:6379/0,redis://redis-4:6379/0,redis://redis-5:6379/0,redis://redis-6:6379/0,redis://redis-7:6379/0"
      RUST_LOG: "info"
      MIGRATE_ONLY: "true"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      postgres-shard-2:
        condition: service_healthy
      postgres-shard-3:
        condition: service_healthy
      postgres-shard-4:
        condition: service_healthy
      postgres-shard-5:
        condition: service_healthy
      postgres-shard-6:
        condition: service_healthy
      postgres-shard-7:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-4:
        condition: service_healthy
      redis-5:
        condition: service_healthy
      redis-6:
        condition: service_healthy
      redis-7:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NUM_SHARDS: "8"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@pgbouncer-shard-{i}:6432/conductor"
      REDIS_URLS: "redis://redis-0:6379/0,redis://redis-1:6379/0,redis://redis-2:6379/0,redis://redis-3:6379/0,redis://redis-4:6379/0,redis://redis-5:6379/0,redis://redis-6:6379/0,redis://redis-7:6379/0"
      RUST_LOG: "warn"
      SKIP_MIGRATIONS: "true"
    deploy:
      replicas: 4
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      pgbouncer-shard-0:
        condition: service_healthy
      pgbouncer-shard-1:
        condition: service_healthy
      pgbouncer-shard-2:
        condition: service_healthy
      pgbouncer-shard-3:
        condition: service_healthy
      pgbouncer-shard-4:
        condition: service_healthy
      pgbouncer-shard-5:
        condition: service_healthy
      pgbouncer-shard-6:
        condition: service_healthy
      pgbouncer-shard-7:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-4:
        condition: service_healthy
      redis-5:
        condition: service_healthy
      redis-6:
        condition: service_healthy
      redis-7:
        condition: service_healthy

  nginx-lb:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

