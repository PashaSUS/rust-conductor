services:
  # Postgres Shard 0 - DEV low memory
  postgres-shard-0:
    image: postgres:17-alpine
    restart: unless-stopped
    command: >
      postgres
      -c max_locks_per_transaction=64
      -c max_connections=50
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c effective_cache_size=128MB
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shard0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-0:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-0:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CARGO_FEATURES: "bare-metal"
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      NUM_SHARDS: "1"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@postgres-shard-{i}:5432/conductor"
      REDIS_URLS: "redis://redis-0:6379"
      RUST_LOG: "info"
      MIGRATE_ONLY: "true"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      redis-0:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CARGO_FEATURES: "bare-metal"
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "50055:50055"
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      GRPC_PORT: "50055"
      NUM_SHARDS: "1"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@postgres-shard-{i}:5432/conductor"
      REDIS_URLS: "redis://redis-0:6379"
      CORS_ORIGIN: "http://localhost:3170"
      RUST_LOG: "info"
      SKIP_MIGRATIONS: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX_REQUESTS: "1000"
      RATE_LIMIT_WINDOW_SECS: "60"
      SWEEPER_MIN_INTERVAL_SECS: "10"
      SWEEPER_MAX_INTERVAL_SECS: "60"
    deploy:
      replicas: 1
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres-shard-0:
        condition: service_healthy
      redis-0:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "http://localhost:8090"
    restart: unless-stopped
    ports:
      - "3170:3170"
    depends_on:
      - backend

volumes:
  pgdata_shard0:
  redisdata-0:
