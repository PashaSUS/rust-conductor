services:
  # ── Postgres Shard 0 ──
  postgres-shard-0:
    image: postgres:16-alpine
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shard0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Postgres Shard 1 ──
  postgres-shard-1:
    image: postgres:16-alpine
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5433:5432"
    volumes:
      - pgdata_shard1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Postgres Shard 2 ──
  postgres-shard-2:
    image: postgres:16-alpine
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5434:5432"
    volumes:
      - pgdata_shard2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Postgres Shard 3 ──
  postgres-shard-3:
    image: postgres:16-alpine
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5435:5432"
    volumes:
      - pgdata_shard3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler in front of shard 0) ──
  pgbouncer-shard-0:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-shard-0
      DB_PORT: "5432"
      DB_USER: conductor
      DB_PASSWORD: conductor
      DB_NAME: conductor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler in front of shard 1) ──
  pgbouncer-shard-1:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-shard-1
      DB_PORT: "5432"
      DB_USER: conductor
      DB_PASSWORD: conductor
      DB_NAME: conductor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6433:6432"
    depends_on:
      postgres-shard-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler in front of shard 2) ──
  pgbouncer-shard-2:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-shard-2
      DB_PORT: "5432"
      DB_USER: conductor
      DB_PASSWORD: conductor
      DB_NAME: conductor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6434:6432"
    depends_on:
      postgres-shard-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler in front of shard 3) ──
  pgbouncer-shard-3:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-shard-3
      DB_PORT: "5432"
      DB_USER: conductor
      DB_PASSWORD: conductor
      DB_NAME: conductor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6435:6432"
    depends_on:
      postgres-shard-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-0:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata-0:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-1:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata-1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-2:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redisdata-2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-3:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - redisdata-3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Seq (structured log server) ──
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "9321:80"
    volumes:
      - seqdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka Broker 0 ──
  kafka-0:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093,4@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      CLUSTER_ID: "conductor-kafka-cluster-001"
    volumes:
      - kafkadata-0:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker 1 ──
  kafka-1:
    image: apache/kafka:3.8.0
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093,4@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      CLUSTER_ID: "conductor-kafka-cluster-001"
    volumes:
      - kafkadata-1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker 2 ──
  kafka-2:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093,4@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      CLUSTER_ID: "conductor-kafka-cluster-001"
    volumes:
      - kafkadata-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker 3 ──
  kafka-3:
    image: apache/kafka:3.8.0
    ports:
      - "9095:9092"
    environment:
      KAFKA_NODE_ID: "4"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093,4@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      CLUSTER_ID: "conductor-kafka-cluster-001"
    volumes:
      - kafkadata-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NUM_SHARDS: "4"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@postgres-shard-{i}:5432/conductor"
      REDIS_URLS: "redis://redis-0:6379,redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379"
      KAFKA_BROKERS: "kafka-0:9092,kafka-1:9092,kafka-2:9092,kafka-3:9092"
      RUST_LOG: "info"
      MIGRATE_ONLY: "true"
      SEQ_URL: "http://seq:80"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      postgres-shard-2:
        condition: service_healthy
      postgres-shard-3:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      seq:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
      - "50051"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      GRPC_PORT: "50051"
      NUM_SHARDS: "4"
      SHARD_DB_URL_TEMPLATE: "postgres://conductor:conductor@pgbouncer-shard-{i}:6432/conductor"
      REDIS_URLS: "redis://redis-0:6379,redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379"
      KAFKA_BROKERS: "kafka-0:9092,kafka-1:9092,kafka-2:9092,kafka-3:9092"
      RUST_LOG: "warn"
      SKIP_MIGRATIONS: "true"
      SEQ_URL: "http://seq:80"
    deploy:
      replicas: 4
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      pgbouncer-shard-0:
        condition: service_healthy
      pgbouncer-shard-1:
        condition: service_healthy
      pgbouncer-shard-2:
        condition: service_healthy
      pgbouncer-shard-3:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      seq:
        condition: service_healthy

  nginx-lb:
    image: nginx:alpine
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata_shard0:
  pgdata_shard1:
  pgdata_shard2:
  pgdata_shard3:
  redisdata-0:
  redisdata-1:
  redisdata-2:
  redisdata-3:
  kafkadata-0:
  kafkadata-1:
  kafkadata-2:
  kafkadata-3:
  seqdata:
