      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler in front of shard 0) ──
  pgbouncer-shard-0:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-shard-0
      DB_PORT: "5432"
      DB_USER: conductor
      DB_PASSWORD: conductor
      DB_NAME: conductor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      postgres-shard-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

