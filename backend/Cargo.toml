[package]
name = "rust-conductor"
version = "0.1.0"
edition = "2024"
description = "A fully Rust-based Conductor-compliant microservice orchestrator"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
deadpool-redis = "0.23"
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dotenvy = "0.15"
thiserror = "2"
futures = "0.3"
num_cpus = "1"
utoipa = { version = "5", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
rust-embed = "8"
rand = { version = "0.8", features = ["std", "small_rng"] }
anyhow = "1.0.102"

# gRPC
tonic = { version = "0.12", features = ["gzip"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["limit"] }

# Kafka (optional — only needed for PROD; DEV uses Redis Streams)
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"], optional = true }

# S3-compatible object storage (MinIO, AWS S3, etc.)
rust-s3 = { version = "0.35", optional = true, default-features = false, features = ["tokio-rustls-tls"] }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
serde_test = "1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis", "kafka"] }
arbitrary = { version = "1", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"

[[bench]]
name = "workflow_bench"
harness = false

[features]
default = ["seq", "kafka"]
seq = []
kafka = ["rdkafka"]
external-storage = ["rust-s3"]
