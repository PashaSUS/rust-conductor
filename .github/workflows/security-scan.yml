name: Container Security Scan

on:
  # Run weekly to catch newly disclosed CVEs
  schedule:
    - cron: "0 6 * * 1"  # Monday 6:00 AM UTC
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to report"
        required: false
        default: "CRITICAL,HIGH"
        type: choice
        options:
          - "CRITICAL"
          - "CRITICAL,HIGH"
          - "CRITICAL,HIGH,MEDIUM"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  scan:
    name: Scan ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            ref: ghcr.io/${{ github.repository }}/backend:latest
          - name: frontend
            ref: ghcr.io/${{ github.repository }}/frontend:latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image.ref }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: ${{ inputs.severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif

      - name: Generate summary table
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image.ref }}
          format: table
          severity: ${{ inputs.severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true

  # Also scan the Dockerfiles for misconfigurations
  dockerfile-scan:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./backend/Dockerfile
          format: table
          severity: CRITICAL,HIGH,MEDIUM

      - name: Scan frontend Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./frontend/Dockerfile
          format: table
          severity: CRITICAL,HIGH,MEDIUM

  # Dependency audit
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit Rust dependencies
        working-directory: backend
        run: cargo audit

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
